; NeoLabs NL-1 Pioneer — Onboard Rocket Computer Firmware
; Board: Seeed Studio XIAO ESP32-S3 Sense
; Sensors (from connections.md + onboard-systems schematic):
;   BMP580 + LSM6DSO32 on I2C (D4/GPIO5 SDA, D5/GPIO6 SCL)
; Camera + microSD: onboard XIAO ESP32-S3 Sense expansion

[platformio]
default_envs = xiao_esp32s3_sense
src_dir = src
include_dir = include

[env:xiao_esp32s3_sense]
platform = platformio/espressif32@6.9.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.arduino.memory_type = qio_opi
board_build.filesystem = littlefs
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
build_flags =
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  -D BOARD_HAS_PSRAM
  -D CONFIG_SPIRAM_SUPPORT=1
  -D CORE_DEBUG_LEVEL=1
  ; FIRMWARE_VERSION defaults in config.h; CI overrides via PLATFORMIO_BUILD_FLAGS
  -D FIRMWARE_NAME=\"NL1-RocketComputer\"
  -Wall
  -Wextra
  -Wno-unused-parameter
lib_deps =
  h2zero/NimBLE-Arduino@2.5.0
  adafruit/Adafruit LSM6DS@^4.7.4
  https://github.com/adafruit/Adafruit_BMP5xx.git
  adafruit/Adafruit BusIO@^1.16.1
  adafruit/Adafruit Unified Sensor@^1.1.14
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600

; Host-side logic tests (state machine, protocol, flight detection)
[env:native_tests]
platform = native
test_framework = unity
build_flags =
  -DUNIT_TEST
  -DFIRMWARE_VERSION=\"1.0.0\"
  -std=c++17
  -I include
  -I src
test_build_src = false
; Must be the test folder name, not a glob of its contents — "test_host/*"
; matches nothing and silently reports SKIPPED (green CI on zero tests run).
test_filter = test_host
